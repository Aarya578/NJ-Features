<style>
    #resizable-div {
        width: 54mm; 
        height: 15mm; 
        position: relative;
        display: flex;
        align-items: center; /* Center items vertically */
        justify-content: center; /* Align items to the start horizontally */
        box-sizing: border-box; /* Include padding and border in element's total width and height */
        padding-top: 3mm;
    }
    
    #text-span {
        word-wrap: break-word;
        white-space: normal; /* Allow text to wrap */
        max-width: calc(49.8mm - 60px); /* Adjust max-width for text wrapping */
        word-break: break-all; /* Ensure long words break to next line */
        line-height: 1; /* Adjust line height to ensure text fits within the div */
        margin: 0px 5px 0px 10px; /* Remove default margin */
    }

    .qr-code {
        max-height: 10mm;
        width: auto;
        margin: auto;
    }
</style>
<div id="resizable-div">
    <span id="text-span">{{ doc.serial_no or doc.name }}</span>
    <img src="{{ frappe.utils.get_url() }}/files/{{ doc.serial_no or doc.name }}.png" class="qr-code" onerror="this.onerror=null; this.src='{{ frappe.utils.get_url() }}/files/{{ doc.serial_no or doc.name }}_qr.jpg';">
</div>
